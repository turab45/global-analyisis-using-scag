[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scag-global-analysis"
version = "0.1.0"
description = "Global semantic coactivation graph analysis of cardiac MRI classifiers"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.2",
  "networkx>=3", "torch>=2.1", "torchvision>=0.16", "SimpleITK>=2.2",
  "matplotlib>=3.7", "hydra-core>=1.3,<1.4", "omegaconf>=2.3,<3",
]

[project.scripts]
scag-global = "scag.__main__:main"

[tool.setuptools.packages.find]
include = ["scag", "scag.*"]

[tool.setuptools.package-data]
scag = ["configs/*.yaml"]
